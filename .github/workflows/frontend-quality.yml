name: Frontend quality

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BETA_DEBUG_TOOLS_ENABLED: "0"
      BETA_RATE_LIMIT_ENABLED: "0"
      BETA_TRUST_PROXY_HEADERS: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: API contract tests
        run: npm run test:api-contract

      - name: Production build
        run: npm run build

      - name: Production client isolation
        run: npm run test:production-client

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Production profile isolation
        run: npm run test:e2e:production-profile
